<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Manollos Spiele</title>

    <link rel="icon" type="image/png" href="https://i.imgur.com/FxoE9VM.png">

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">

    <style>
        .pattern-preview {
            width: 100%;
            height: 40px;
            border-radius: 4px;
            margin-bottom: 8px;
            border: 1px solid #e5e7eb;
        }
/* Game opening transition */
.game-transition-overlay {
    position: fixed;
    z-index: 99999;
    pointer-events: none;
    margin: 0;
    border-radius: 8px;
    transition:
        top 0.9s cubic-bezier(0.76, 0, 0.24, 1),
        left 0.9s cubic-bezier(0.76, 0, 0.24, 1),
        width 0.9s cubic-bezier(0.76, 0, 0.24, 1),
        height 0.9s cubic-bezier(0.76, 0, 0.24, 1),
        border-radius 0.9s cubic-bezier(0.76, 0, 0.24, 1);
}
        .close-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #6b7280;
        }

        .close-btn:hover {
            color: #374151;
        }

        /* Add outline to header text */
        #headerText {
            -webkit-text-stroke: 1px;
        }

        /* Mobile-specific styles */
        .rogue-game {
            background: white !important;
            color: #111827 !important;
        }

        .rogue-game svg {
            color: #111827 !important;
        }

        @media (max-width: 640px) {
            #headerText {
                font-size: 8vw;
            }

            .pattern-preview {
                height: 30px;
            }

            #colorPickerDropdown {
                width: 90vw;
                max-width: 300px;
                right: 50%;
                transform: translateX(50%);
            }

            .group {
                padding: 1.5rem;
            }

            .group svg {
                width: 3.5rem;
                height: 3.5rem;
            }

            .group span {
                font-size: 1.25rem;
            }

            .container {
                padding-left: 1rem;
                padding-right: 1rem;
            }
        }


        /* Random-event corner button */
        #chaosButton {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 300000;
            width: 86px;
            height: 86px;
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
            user-select: none;
            -webkit-user-drag: none;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,.35));
            transition: transform .12s ease;
        }

        #chaosButton:hover { transform: scale(1.06); }
        #chaosButton:active { transform: scale(.95); }
        #chaosButton img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            -webkit-user-drag: none;
        }

        #heartDisplay {
            position: fixed;
            top: 108px;
            left: 35px;
            z-index: 300000;
            display: none;
            flex-direction: column;
            gap: 4px;
            pointer-events: none;
        }

        #heartDisplay.visible { display: flex; }
        #heartDisplay img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            filter: drop-shadow(0 3px 4px rgba(0,0,0,.35));
        }

        #pageWorld {
            width: 100%;
            min-height: 100vh;
            transform-origin: center center;
            transition: transform .75s cubic-bezier(.2,.8,.2,1);
        }

        .chaos-ball {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 120000;
            width: 42px;
            height: 42px;
            border-radius: 9999px;
            background: radial-gradient(circle at 30% 28%, #ffffff 0 7%, #7dd3fc 10%, #2563eb 45%, #172554 100%);
            box-shadow: 0 5px 12px rgba(0,0,0,.35);
            cursor: grab;
            user-select: none;
            touch-action: none;
        }

        .chaos-ball:active { cursor: grabbing; }

        .cursor-haunter {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 250000;
            width: 76px;
            height: 76px;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            filter: drop-shadow(0 5px 8px rgba(0,0,0,.45));
            will-change: transform;
        }

        @media (max-width: 640px) {
            #chaosButton {
                width: 66px;
                height: 66px;
                top: 10px;
                left: 10px;
            }

            #heartDisplay {
                top: 82px;
                left: 21px;
            }

            #heartDisplay img {
                width: 42px;
                height: 42px;
            }
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center" id="body">

    <button id="chaosButton" type="button" aria-label="Random event">
        <img id="chaosButtonImage" src="https://i.imgur.com/9YjVx84.png" alt="Random event">
    </button>
    <div id="heartDisplay" aria-label="Lives"></div>

    <div id="pageWorld">

    <!-- Farbpicker zur Änderung der Hintergrundfarbe -->
    <div class="fixed top-4 right-4 z-20">
        <div class="relative" id="colorPickerContainer">

            <button
                id="colorPickerButton"
                class="bg-white text-gray-800 font-semibold py-2 px-4 rounded-lg shadow-lg flex items-center gap-2 hover:bg-gray-100 transition-colors touch-none"
            >
                <svg
                    class="w-5 h-5 md:w-6 md:h-6"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4l2 2h6a2 2 0 012 2v10a4 4 0 01-4 4H7z"
                    ></path>
                </svg>

                Hintergrund
            </button>

            <div
                id="colorPickerDropdown"
                class="absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-xl p-4 hidden md:w-96"
            >
                <button class="close-btn" id="closeColorPicker">×</button>

                <h3 class="text-lg font-bold text-gray-800 mb-4">
                    Hintergrund anpassen
                </h3>

                <div class="mb-4">
                    <label
                        for="bgColorPicker1"
                        class="block text-gray-800 font-semibold mb-2"
                    >
                        Erste Farbe:
                    </label>

                    <input
                        type="color"
                        id="bgColorPicker1"
                        value="#1e293b"
                        class="w-full h-10 rounded border-none cursor-pointer"
                    />
                </div>

                <div class="mb-4">
                    <label
                        for="bgColorPicker2"
                        class="block text-gray-800 font-semibold mb-2"
                    >
                        Zweite Farbe:
                    </label>

                    <input
                        type="color"
                        id="bgColorPicker2"
                        value="#1e40af"
                        class="w-full h-10 rounded border-none cursor-pointer"
                    />
                </div>

                <div class="mb-4">
                    <label
                        for="patternSelect"
                        class="block text-gray-800 font-semibold mb-2"
                    >
                        Muster:
                    </label>

                    <select
                        id="patternSelect"
                        class="w-full p-2 rounded border border-gray-300 mb-2"
                    >
                        <option value="solid">Einfarbig</option>
                        <option value="gradient">Verlauf</option>
                        <option value="geometric">Geometrisch</option>
                        <option value="dots">Punkte</option>
                        <option value="triangles">Dreiecke</option>
                        <option value="confetti">Konfetti</option>
                    </select>

                    <!-- Pattern Previews -->
                    <div class="grid grid-cols-2 gap-2 mt-2">

                        <div>
                            <div
                                class="pattern-preview bg-gray-800"
                                data-pattern="solid"
                            ></div>
                            <span class="text-xs text-gray-600">Einfarbig</span>
                        </div>

                        <div>
                            <div
                                class="pattern-preview bg-gradient-to-br from-gray-800 to-blue-900"
                                data-pattern="gradient"
                            ></div>
                            <span class="text-xs text-gray-600">Verlauf</span>
                        </div>

                        <div>
                            <div
                                class="pattern-preview"
                                data-pattern="geometric"
                            ></div>
                            <span class="text-xs text-gray-600">Geometrisch</span>
                        </div>

                        <div>
                            <div
                                class="pattern-preview"
                                style="
                                    background:
                                        radial-gradient(circle at 25% 25%, #1e40af 2px, transparent 2px),
                                        radial-gradient(circle at 75% 75%, #1e40af 2px, transparent 2px);
                                    background-color: #1e293b;
                                    background-size: 20px 20px;
                                "
                                data-pattern="dots"
                            ></div>

                            <span class="text-xs text-gray-600">Punkte</span>
                        </div>

                        <div>
                            <div
                                class="pattern-preview"
                                style="
                                    background:
                                        linear-gradient(45deg, #1e40af 25%, transparent 25%, transparent 75%, #1e40af 75%) 0 0/20px 20px,
                                        linear-gradient(-45deg, #1e40af 25%, transparent 25%, transparent 75%, #1e40af 75%) 0 0/20px 20px;
                                    background-color: #1e293b;
                                "
                                data-pattern="triangles"
                            ></div>

                            <span class="text-xs text-gray-600">Dreiecke</span>
                        </div>

                        <div>
                            <div
                                class="pattern-preview"
                                style="
                                    background:
                                        radial-gradient(circle at 20% 30%, #1e40af 2px, transparent 2px),
                                        radial-gradient(circle at 80% 70%, #1e40af 2px, transparent 2px),
                                        radial-gradient(circle at 40% 20%, #1e40af 1px, transparent 1px),
                                        radial-gradient(circle at 65% 35%, #1e40af 1px, transparent 1px);
                                    background-color: #1e293b;
                                    background-size: 50px 50px;
                                "
                                data-pattern="confetti"
                            ></div>

                            <span class="text-xs text-gray-600">Konfetti</span>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

            const b = parseInt(hex.substring(4, 6), 16);

            const luminance =
                (0.299 * r + 0.587 * g + 0.114 * b) / 255;

            const textColor =
                luminance < 0.5 ? '#ffffff' : '#000000';

            const strokeColor =
                luminance < 0.5 ? '#000000' : '#ffffff';

            headerText.style.color = textColor;
            headerText.style.webkitTextStrokeColor = strokeColor;
        }

        function randomBallColor(ball) {
            const hue = Math.floor(Math.random() * 360);
            const hue2 = (hue + 38) % 360;
            ball.el.style.background = `radial-gradient(circle at 30% 28%, #ffffff 0 7%, hsl(${hue2} 90% 72%) 10%, hsl(${hue} 82% 52%) 48%, hsl(${hue} 75% 20%) 100%)`;
        }

        /* Event 3: one permanent bouncing, draggable ball */
        function spawnBall() {
            const el = document.createElement('div');
            el.className = 'chaos-ball';
            el.setAttribute('aria-label', 'Bouncing ball');
            document.body.appendChild(el);

            const size = 42;
            const normalSpeed = 185; // pixels per second
            const angle = Math.random() * Math.PI * 2;
            const ball = {
                el,
                size,
                x: Math.random() * Math.max(1, innerWidth - size),
                y: Math.random() * Math.max(1, innerHeight - size),
                vx: Math.cos(angle) * normalSpeed,
                vy: Math.sin(angle) * normalSpeed,
                normalSpeed,
                boostUntil: 0,
                dragging: false,
                dragMoved: false,
                pointerId: null,
                lastPointerX: 0,
                lastPointerY: 0
            };

            balls.push(ball);
            el.style.transform = `translate(${ball.x}px, ${ball.y}px)`;

            el.addEventListener('pointerdown', e => {
                ball.dragging = true;
                ball.dragMoved = false;
                ball.pointerId = e.pointerId;
                ball.lastPointerX = e.clientX;
                ball.lastPointerY = e.clientY;
                el.setPointerCapture(e.pointerId);
                e.preventDefault();
            });

            el.addEventListener('pointermove', e => {
                if (!ball.dragging || e.pointerId !== ball.pointerId) return;
                const dx = e.clientX - ball.lastPointerX;
                const dy = e.clientY - ball.lastPointerY;
                if (Math.abs(dx) + Math.abs(dy) > 2) ball.dragMoved = true;
                ball.x = Math.min(Math.max(0, ball.x + dx), innerWidth - ball.size);
                ball.y = Math.min(Math.max(0, ball.y + dy), innerHeight - ball.size);
                ball.lastPointerX = e.clientX;
                ball.lastPointerY = e.clientY;
                el.style.transform = `translate(${ball.x}px, ${ball.y}px)`;
            });

            function releaseBall(e) {
                if (!ball.dragging || e.pointerId !== ball.pointerId) return;
                ball.dragging = false;
                try { el.releasePointerCapture(e.pointerId); } catch (_) {}

                // A click/tap (not a drag) gives it a brief random-direction speed boost.
                if (!ball.dragMoved) {
                    const a = Math.random() * Math.PI * 2;
                    const boostedSpeed = ball.normalSpeed * 3.2;
                    ball.vx = Math.cos(a) * boostedSpeed;
                    ball.vy = Math.sin(a) * boostedSpeed;
                    ball.boostUntil = performance.now() + 650;
                }
            }

            el.addEventListener('pointerup', releaseBall);
            el.addEventListener('pointercancel', releaseBall);
        }

        let lastBallFrame = performance.now();
        function animateBalls(now) {
            const dt = Math.min((now - lastBallFrame) / 1000, 0.04);
            lastBallFrame = now;

            balls.forEach(ball => {
                if (ball.dragging) return;

                // After a boost, return to normal speed while keeping the direction.
                if (ball.boostUntil && now >= ball.boostUntil) {
                    const current = Math.hypot(ball.vx, ball.vy) || 1;
                    ball.vx = ball.vx / current * ball.normalSpeed;
                    ball.vy = ball.vy / current * ball.normalSpeed;
                    ball.boostUntil = 0;
                }

                ball.x += ball.vx * dt;
                ball.y += ball.vy * dt;

                const maxX = Math.max(0, innerWidth - ball.size);
                const maxY = Math.max(0, innerHeight - ball.size);

                if (ball.x <= 0) {
                    ball.x = 0;
                    ball.vx = Math.abs(ball.vx);
                } else if (ball.x >= maxX) {
                    ball.x = maxX;
                    ball.vx = -Math.abs(ball.vx);
                }

                if (ball.y <= 0) {
                    ball.y = 0;
                    ball.vy = Math.abs(ball.vy);
                } else if (ball.y >= maxY) {
                    ball.y = maxY;
                    ball.vy = -Math.abs(ball.vy);
                }

                ball.el.style.transform = `translate(${ball.x}px, ${ball.y}px)`;
            });

            // Ball-to-ball collisions: repel, boost and recolor both balls.
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    const a = balls[i];
                    const b = balls[j];
                    if (a.dragging || b.dragging) continue;

                    const ar = a.size / 2;
                    const br = b.size / 2;
                    const ax = a.x + ar, ay = a.y + ar;
                    const bx = b.x + br, by = b.y + br;
                    let dx = bx - ax, dy = by - ay;
                    let dist = Math.hypot(dx, dy);
                    const minDist = ar + br;
                    if (dist >= minDist) continue;

                    if (dist < 0.001) {
                        const ang = Math.random() * Math.PI * 2;
                        dx = Math.cos(ang); dy = Math.sin(ang); dist = 1;
                    }
                    const nx = dx / dist, ny = dy / dist;
                    const relativeAlongNormal = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;

                    // Separate them immediately so the same collision is not triggered every frame.
                    const overlap = minDist - dist + 0.5;
                    a.x -= nx * overlap / 2; a.y -= ny * overlap / 2;
                    b.x += nx * overlap / 2; b.y += ny * overlap / 2;

                    // Only bounce/boost if they are moving toward one another.
                    if (relativeAlongNormal < 0) {
                        const avn = a.vx * nx + a.vy * ny;
                        const bvn = b.vx * nx + b.vy * ny;
                        a.vx += (bvn - avn) * nx;
                        a.vy += (bvn - avn) * ny;
                        b.vx += (avn - bvn) * nx;
                        b.vy += (avn - bvn) * ny;

                        const boost = 1.55;
                        for (const ball of [a, b]) {
                            const mag = Math.hypot(ball.vx, ball.vy) || 1;
                            const boosted = ball.normalSpeed * boost;
                            ball.vx = ball.vx / mag * boosted;
                            ball.vy = ball.vy / mag * boosted;
                            ball.boostUntil = now + 800;
                            randomBallColor(ball);
                        }
                    }
                }
            }

            requestAnimationFrame(animateBalls);
        }
        requestAnimationFrame(animateBalls);

            const placeholder = document.createComment('rogue-swap');
            rogue.replaceWith(placeholder);
            other.replaceWith(rogue);
            placeholder.replaceWith(other);

            ['Nexon', 'Nexon'],
            ['Spike', 'Pigg'],
            ['Key Rush', 'Tasterush'],
            ['Penalty', 'Straffespark'],
            ['Air Ltd.', 'Flyselskap AS']
        ]);

        const languageMaps = {
            de: new Map(),
            zh: chineseTranslationMap,
            no: norwegianTranslationMap
        };

        function translateTextNodes(root, map) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const nodes = [];
            while (walker.nextNode()) nodes.push(walker.currentNode);

            nodes.forEach(node => {
                const raw = node.nodeValue;
                const trimmed = raw.trim();
                if (!trimmed || !map.has(trimmed)) return;
                node.nodeValue = raw.replace(trimmed, map.get(trimmed));
            });

            // Select option text needs a direct pass in some browsers.
            root.querySelectorAll('option').forEach(option => {
                const t = option.textContent.trim();
                if (map.has(t)) option.textContent = map.get(t);
            });
        }

        function switchLanguage() {
            const choices = ['de', 'zh', 'no'].filter(language => language !== currentLanguage);
            const nextLanguage = randomItem(choices);

            if (currentLanguage !== 'de') {
                const backToGerman = new Map([...languageMaps[currentLanguage]].map(([de, translated]) => [translated, de]));
                translateTextNodes(pageWorld, backToGerman);
            }
            if (nextLanguage !== 'de') translateTextNodes(pageWorld, languageMaps[nextLanguage]);

            currentLanguage = nextLanguage;
            document.documentElement.lang = nextLanguage === 'zh' ? 'zh-CN' : nextLanguage;
            const labels = { de: 'Zufälliges Ereignis', zh: '随机事件', no: 'Tilfeldig hendelse' };
            chaosButton.setAttribute('aria-label', labels[nextLanguage]);
        }

        /* Event 8: randomize only the image; its fixed corner position stays unchanged */
        function switchCornerImage() {
            const current = chaosButtonImage.src;
            let choices = chaosImages.filter(url => url !== current);
            // URL normalization can make the string differ, so fall back safely.
            if (!choices.length) choices = chaosImages;
            chaosButtonImage.src = randomItem(choices);
        }

        /* Event 9: choose entirely random colors and a random background pattern. */
        function randomizeBackground() {
            const randomColor = () => '#' + Math.floor(Math.random() * 0x1000000)
                .toString(16).padStart(6, '0');
            const patterns = [...patternSelect.options].map(option => option.value);

            colorPicker1.value = randomColor();
            colorPicker2.value = randomColor();
            patternSelect.value = randomItem(patterns);
            updateBackground();
        }

        /* Event 10: add one slow, stackable image that hunts the cursor. */
        function spawnCursorHaunter() {
            if (!heartsStarted) {
                heartsStarted = true;
                updateHeartDisplay();
            }
            const size = 76;
            const minimumDistance = Math.min(260, Math.max(120, Math.min(innerWidth, innerHeight) * 0.3));
            let x = 0;
            let y = 0;

            // Try several random positions so it does not appear directly beside the cursor.
            for (let attempt = 0; attempt < 30; attempt++) {
                x = Math.random() * Math.max(1, innerWidth - size);
                y = Math.random() * Math.max(1, innerHeight - size);
                if (Math.hypot(x + size / 2 - cursorX, y + size / 2 - cursorY) >= minimumDistance) break;
            }

            const el = document.createElement('img');
            el.className = 'cursor-haunter';
            el.src = 'https://i.imgur.com/myfT3Zm.png';
            el.alt = '';
            document.body.appendChild(el);

            const haunter = { el, x, y, size, speed: 27 };
            cursorHaunters.push(haunter);
            el.style.transform = `translate(${x}px, ${y}px)`;
        }

        function updateHeartDisplay() {
            heartDisplay.replaceChildren();
            for (let i = 0; i < hearts; i++) {
                const heart = document.createElement('img');
                heart.src = 'https://i.imgur.com/5JgHIt9.png';
                heart.alt = '';
                heartDisplay.appendChild(heart);
            }
            heartDisplay.classList.toggle('visible', heartsStarted);
            heartDisplay.setAttribute('aria-label', `${hearts} ${hearts === 1 ? 'life' : 'lives'}`);
        }

        function closeSite() {
            window.close();
            setTimeout(() => {
                if (!window.closed) window.location.replace('about:blank');
            }, 100);
        }

        function loseHeart(haunter) {
            const index = cursorHaunters.indexOf(haunter);
            if (index !== -1) cursorHaunters.splice(index, 1);
            haunter.el.remove();
            hearts = Math.max(0, hearts - 1);
            updateHeartDisplay();
            if (hearts === 0) closeSite();
        }

        function gainHeart() {
            if (heartsStarted && hearts < 6) {
                hearts++;
                updateHeartDisplay();
                return;
            }
            runRandomEvent(gainHeart);
        }

        document.addEventListener('pointermove', e => {
            cursorX = e.clientX;
            cursorY = e.clientY;
        });

        let lastHaunterFrame = performance.now();
        function animateCursorHaunters(now) {
            const dt = Math.min((now - lastHaunterFrame) / 1000, 0.05);
            lastHaunterFrame = now;

            [...cursorHaunters].forEach(haunter => {
                const centerX = haunter.x + haunter.size / 2;
                const centerY = haunter.y + haunter.size / 2;
                const dx = cursorX - centerX;
                const dy = cursorY - centerY;
                const distance = Math.hypot(dx, dy);

if (distance <= haunter.size * 0.42) {
    loseHeart(haunter);
    return;
}

                if (distance > 0) {
                    const step = Math.min(haunter.speed * dt, distance);
                    haunter.x += dx / distance * step;
                    haunter.y += dy / distance * step;
                    haunter.el.style.transform = `translate(${haunter.x}px, ${haunter.y}px)`;
                }
            });

            requestAnimationFrame(animateCursorHaunters);
        }
        requestAnimationFrame(animateCursorHaunters);

        // Keep every bouncing ball strictly inside the visible viewport, even after resize.
        function clampBallsToViewport() {
            balls.forEach(ball => {
                const maxX = Math.max(0, innerWidth - ball.size);
                const maxY = Math.max(0, innerHeight - ball.size);
                ball.x = Math.min(Math.max(0, ball.x), maxX);
                ball.y = Math.min(Math.max(0, ball.y), maxY);
                ball.el.style.transform = `translate(${ball.x}px, ${ball.y}px)`;
            });
        }
        window.addEventListener('resize', () => {
            clampBallsToViewport();
            cursorHaunters.forEach(haunter => {
                haunter.x = Math.min(Math.max(0, haunter.x), Math.max(0, innerWidth - haunter.size));
                haunter.y = Math.min(Math.max(0, haunter.y), Math.max(0, innerHeight - haunter.size));
                haunter.el.style.transform = `translate(${haunter.x}px, ${haunter.y}px)`;
            });
        });

        // Every game card ALWAYS opens in a new browser tab.
        function forceGameLinksToNewTabs() {
            gameGrid.querySelectorAll('a[href]').forEach(link => {
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
            });
        }
        forceGameLinksToNewTabs();

        const randomEvents = [
            openRandomGame,
            playRandomSong,
            spawnBall,
            flipPage,
            shuffleGames,
            toggleRandomRogueGame,
            switchLanguage,
            switchCornerImage,
            randomizeBackground,
            spawnCursorHaunter,
            gainHeart
        ];

        function runRandomEvent(excludedEvent = null) {
            const choices = excludedEvent
                ? randomEvents.filter(event => event !== excludedEvent)
                : randomEvents;
            randomItem(choices)();
        }

        chaosButton.addEventListener('click', () => {
            runRandomEvent();
        });

    </script>

</body>
